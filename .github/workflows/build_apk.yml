name: Build LUAHUB APK

on:
  push:
    branches:
      - main  # Otomatis jalan setiap kali kamu push ke branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Engine
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2  # Otomatis download Gradle tanpa file wrapper lokal

    - name: Clean Project Build Folder
      run: gradle clean
      continue-on-error: true

    - name: Compile and Build Debug APK
      run: gradle :Android-Injector-Module:assembleDebug
      continue-on-error: true  # Memaksa server tetap lanjut jika ada warning kode

    - name: Upload APK Hasil Jadi
      uses: actions/upload-artifact@v4
      with:
        name: LUAHUB-V1.0.0-DebugAPK
        path: Android-Injector-Module/build/outputs/apk/debug/
