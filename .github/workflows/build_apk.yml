name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Solusi buat ngelewatan prompt lisensi yang nyangkut kemarin
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        # Kalau gradlew ada di root project. Kalau posisinya di dalem modul, sesuaikan path-nya ya.

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug
        # Ganti ke assembleRelease kalau butuh versi release (jangan lupa setting signing-nya)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/**/*.apk
