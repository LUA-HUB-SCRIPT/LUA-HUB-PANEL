name: Build LUAHUB APK

on:
  push:
    branches:
      - main  # Otomatis rakit APK setiap kali lo push ke branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2  # Otomatis mengunduh dan setup engine Gradle tanpa perlu file wrapper lokal!

    - name: Build Debug APK via GitHub Server
      run: gradle :Android-Injector-Module:assembleDebug

    - name: Upload APK Hasil Jadi
      uses: actions/upload-artifact@v4
      with:
        name: LUAHUB-V1.0.0-DebugAPK
        path: Android-Injector-Module/build/outputs/apk/debug/Android-Injector-Module-debug.apk
