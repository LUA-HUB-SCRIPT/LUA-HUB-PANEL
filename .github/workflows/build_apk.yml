
name: LUAHUB PANEL - APK Builder

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LUAHUB Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Check Project
        run: |
          echo "Checking LUAHUB PANEL..."
          ls -la
          echo "Checking Android module..."
          ls -la Android-Injector-Module

      - name: Build Debug APK
        run: |
          ./gradlew \
            :Android-Injector-Module:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUAHUB-PANEL-APK
          path: Android-Injector-Module/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Completed
        if: success()
        run: echo "LUAHUB PANEL APK BUILD SUCCESS!"

      - name: Build Failed
        if: failure()
        run: echo "LUAHUB PANEL APK BUILD FAILED!"
